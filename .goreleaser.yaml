version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/shayd3/snoo-dl/cmd.version={{ .Version }}
      - -X github.com/shayd3/snoo-dl/cmd.commit={{ .ShortCommit }}
      - -X github.com/shayd3/snoo-dl/cmd.date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
